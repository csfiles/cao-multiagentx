[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "supportmesh-mcp-server"
version = "0.1.0"
description = "SupportMesh MCP server — customer support tools for CAO agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=1.9.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
supportmesh-mcp-server = "mcp.customer_support_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["mcp"]
