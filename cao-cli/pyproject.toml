[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cao-cli"
version = "1.0.0"
description = "CLI Agent Orchestrator — multi-agent orchestration via Markdown agent profiles and MCP"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "CAO CLI Contributors"}]
keywords = ["ai", "agents", "mcp", "orchestration", "claude", "multi-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "mcp>=1.0.0",
    "anyio>=4.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]
server = [
    "fastapi>=0.111.0",
    "uvicorn>=0.29.0",
]

[project.scripts]
cao = "cao.cli:main"
cao-mcp-server = "cao.mcp_server:run_server"
cao-server = "cao.server:run"

[tool.hatch.build.targets.wheel]
packages = ["src/cao"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
